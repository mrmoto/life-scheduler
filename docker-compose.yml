# =============================================================================
# Life Scheduler - Docker Compose Configuration
# =============================================================================
# Development environment with app + database services

version: '3.8'

services:
  # Flask Application Service
  app:
    container_name: life-scheduler-app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:5000"  # Host:Container (Flask runs on 5000 inside)
    volumes:
      - .:/app  # Mount project root to /app for hot reload
    environment:
      - FLASK_APP=app:create_app
      - FLASK_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - life-scheduler-network

  # PostgreSQL Database Service
  db:
    container_name: life-scheduler-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - life-scheduler-network
    # Note: 5432 not exposed to host - only accessible via Docker network

# Named volume for PostgreSQL data persistence
volumes:
  postgres_data:
    driver: local

# Network for service communication
networks:
  life-scheduler-network:
    driver: bridge

