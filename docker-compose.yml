version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: life-scheduler-db
    ports:
      - "5432"  # Internal only, not exposed to host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifescheduler}
      POSTGRES_USER: ${POSTGRES_USER:-lifescheduler_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifescheduler_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: life-scheduler-app
    ports:
      - "8000:5000"  # Host:Container
    volumes:
      - .:/app  # Hot reload
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifescheduler_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifescheduler}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: python app/app.py

volumes:
  postgres_data:
    driver: local

